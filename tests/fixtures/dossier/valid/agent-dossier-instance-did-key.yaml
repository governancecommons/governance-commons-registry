dossier_metadata:
  dossier_version: 1.0.0
  specification_version: 1.3.0
  status: active
  created_at: 2026-06-07T00:00:00Z
  updated_at: 2026-06-07T00:00:00Z

identity:
  agent_id: example-signing-agent
  display_name: Example Signing Agent
  agent_class: implementation
  authority_scope:
    - generic artifact authoring
    - handoff envelope signing
  capability_claims:
    - capability: handoff-envelope-signing
      declared_at: 2026-06-09T02:35:47Z
      scope:
        - agent handoff envelopes
      source: agent-dossier.yaml#handoff_protocol.signature_block
  crypto_identity:
    did: did:key:z6MkhaXgBZDvotDkL5257faiztiGiC2QtKLGpbnnEGta2doK

contract:
  task_scope:
    - Author and sign governance artifacts using the declared Ed25519 key.
  deliverables:
    - Signed handoff envelopes with verifiable crypto_identity binding.
  acceptance_criteria:
    - Envelope signatures verify against the declared did:key public key.
  lifecycle_state: accepted

constraints:
  - Do not sign envelopes on behalf of other agents.
  - Do not expose private key material in any artifact or log.

resource_budget:
  retry_limit: 2
  escalation_threshold: Escalate on key resolution failure or signature verification error.

tool_permissions:
  - tool_name: crypto.sign
    permission: execute
    scope:
      - agent handoff envelopes
    approval_required: false
    audit_required: true

escalation_protocol:
  default_level: 0
  levels:
    - level: 0
      trigger: Transient signing error.
      action: Retry with documented assumption.
    - level: 2
      trigger: Private key unavailable or corrupted.
      action: Halt signing operations and request operator key rotation.
    - level: 3
      trigger: Key compromise suspected.
      action: Stop all operations and trigger dossier revocation with reason compromised.
