name: Cross-platform SDK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test source
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pytest -q
      - name: Build clean artifacts
        run: python -m build --sdist --wheel
      - name: Install built wheel and smoke-test console scripts
        run: python tests/clean_install_smoke.py

  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test and build source
        run: |
          npm ci
          npm test
      - name: Pack and install registry-shaped artifact
        run: |
          node -e "require('node:fs').mkdirSync('artifacts', { recursive: true })"
          npm pack --pack-destination artifacts
          npm install --global ./artifacts/governance-commons-0.2.0.tgz
      - name: Smoke-test installed console scripts
        run: node tests/clean-install-smoke.mjs
