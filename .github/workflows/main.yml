name: Publish Python SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version to validate before publication (for example 0.2.0)"
        required: true
        type: string
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == sdk-v* ]]; then
            echo "SDK_VERSION=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_ENV"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "SDK_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "A release tag or explicit version is required" >&2
            exit 1
          fi
      - run: python -m pip install --upgrade build twine ".[dev]"
      - run: python tests/release_acceptance.py
      - run: python -m pytest -q
      - run: python -m build --sdist --wheel
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/governance-commons
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
