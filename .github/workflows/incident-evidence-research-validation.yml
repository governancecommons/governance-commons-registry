name: Incident Evidence Research Validation

on:
  push:
    paths:
      - 'docs/research/gc-incident-evidence-draft/**'
      - '.github/workflows/incident-evidence-research-validation.yml'
  workflow_dispatch:

jobs:
  draft-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install 'jsonschema[format]>=4.23'
      - name: Validate draft schema, fixtures, and report-local semantics
        run: python docs/research/gc-incident-evidence-draft/validate_draft.py
      - name: Validate linked Governance Records, authority, and review
        run: python docs/research/gc-incident-evidence-draft/test_cross_record.py
      - name: Validate OECD 29-criterion research mapping
        run: python docs/research/gc-incident-evidence-draft/test_oecd_mapping.py
      - name: Validate OECD mandatory-field research adapter
        run: python docs/research/gc-incident-evidence-draft/oecd-mandatory/test_oecd_mandatory.py
      - name: Validate OECD adapter binding and privacy export guard
        run: python docs/research/gc-incident-evidence-draft/oecd-mandatory/test_export_adapter.py
      - name: Validate 22 optional OECD research fields
        run: python docs/research/gc-incident-evidence-draft/oecd-optional/test_optional.py
      - name: Verify optional evidence excluded from public export
        run: python docs/research/gc-incident-evidence-draft/oecd-optional/test_bundle.py
      - name: Verify incident research acceptance and release boundaries
        run: python docs/research/gc-incident-evidence-draft/test_acceptance_status.py
      - name: Verify OECD primary-source audit and interoperability claim boundaries
        run: python docs/research/gc-incident-evidence-draft/test_oecd_source_audit.py
      - name: Verify 29-criterion OECD source review matrix
        run: python docs/research/gc-incident-evidence-draft/test_oecd_criterion_review.py
      - name: Reject unsupported OECD audit and conformance claims
        run: python docs/research/gc-incident-evidence-draft/test_oecd_review_adversarial.py
      - name: Verify OECD Annex B source-derived answer formats
        run: python docs/research/gc-incident-evidence-draft/test_oecd_annex_b_formats.py
      - name: Verify GC-INCIDENT.08 independent fixture research gate
        run: python docs/research/gc-incident-evidence-draft/test_independent_fixture_gate.py
      - name: Cross-check primary OECD Annex B structural review
        run: python docs/research/gc-incident-evidence-draft/test_oecd_primary_review.py
      - name: Exercise synthetic OECD adapter acceptance and rejection cases
        run: python docs/research/gc-incident-evidence-draft/test_synthetic_adapter_cases.py
