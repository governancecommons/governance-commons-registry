name: Incident Evidence Research Validation

on:
  push:
    paths:
      - 'docs/research/gc-incident-evidence-draft/**'
      - '.github/workflows/incident-evidence-research-validation.yml'
  workflow_dispatch:

jobs:
  draft-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install 'jsonschema[format]>=4.23'
      - name: Validate draft schema, fixtures, and report-local semantics
        run: python docs/research/gc-incident-evidence-draft/validate_draft.py
      - name: Validate linked Governance Records, authority, and review
        run: python docs/research/gc-incident-evidence-draft/test_cross_record.py
      - name: Validate OECD 29-criterion research mapping
        run: python docs/research/gc-incident-evidence-draft/test_oecd_mapping.py
